{{- $linkFormat := .Values.index.linkFormat -}}
{{- if not (has $linkFormat (list "path" "subdomain")) -}}
{{- fail "index.linkFormat must be \"path\" or \"subdomain\"" -}}
{{- end -}}
{{- if empty .Values.index.namespaces -}}
{{- fail "index.namespaces must contain at least one namespace" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nginx-proxy.fullname" . }}
  labels:
    {{- include "nginx-proxy.labels" . | nindent 4 }}
data:
  default.conf: |
    lua_shared_dict spark_service_index 1m;

    server {
      listen 8080 default_server;
      server_name {{ .Values.proxy.baseDomain }};

      resolver {{ .Values.proxy.resolver }} valid=10s;

      location ~ ^/flink/(?<service>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)/(?<namespace>{{ join "|" .Values.index.namespaces }})(?<ui_path>/.*)$ {
        proxy_pass http://$service.$namespace.svc.{{ .Values.proxy.clusterDomain }}:{{ .Values.proxy.flinkUpstream.port }}$ui_path$is_args$args;
        {{- if eq $linkFormat "path" }}
        proxy_redirect ~^https?://[^/]+(/.*)$ /flink/$service/$namespace$1;
        proxy_redirect ~^(/.*)$ /flink/$service/$namespace$1;
        absolute_redirect off;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/flink/$service/$namespace/';
        sub_filter 'src="/' 'src="/flink/$service/$namespace/';
        sub_filter 'action="/' 'action="/flink/$service/$namespace/';
        {{- end }}
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ~ ^/(?<service>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)/(?<namespace>{{ join "|" .Values.index.namespaces }})(?<ui_path>/.*)$ {
        proxy_pass http://$service.$namespace.svc.{{ .Values.proxy.clusterDomain }}:{{ .Values.proxy.upstream.port }}$ui_path$is_args$args;
        {{- if eq $linkFormat "path" }}
        proxy_redirect ~^https?://[^/]+(/.*)$ /$service/$namespace$1;
        proxy_redirect ~^(/.*)$ /$service/$namespace$1;
        absolute_redirect off;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/$service/$namespace/';
        sub_filter 'src="/' 'src="/$service/$namespace/';
        sub_filter 'action="/' 'action="/$service/$namespace/';
        sub_filter "setUIRoot('')" "setUIRoot('/$service/$namespace')";
        sub_filter "setAppBasePath('')" "setAppBasePath('/$service/$namespace')";
        sub_filter '"/api/' '"/$service/$namespace/api/';
        sub_filter "'/api/" "'/$service/$namespace/api/";
        {{- end }}
        proxy_http_version 1.1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location = /api/services {
        content_by_lua_file /etc/spark-ui/spark-services.lua;
      }

      location = / {
        root /etc/spark-ui;
        index index.html;
      }

      location = /index.html {
        internal;
        root /etc/spark-ui;
        add_header Cache-Control "no-cache";
      }

      location = /assets/app.css {
        alias /etc/spark-ui/app.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
      }

      location = /assets/app.js {
        alias /etc/spark-ui/app.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
      }

      location = /assets/spark-logo.svg {
        alias /etc/spark-ui/spark-logo.svg;
        default_type image/svg+xml;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
      }

      location = /assets/flink-logo.svg {
        alias /etc/spark-ui/flink-logo.svg;
        default_type image/svg+xml;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
      }

      location = /favicon.ico {
        return 204;
      }

      location = /_kubernetes_services {
        internal;
        set_by_lua_block $kubernetes_token {
          local token_file = assert(io.open("/var/run/secrets/kubernetes.io/serviceaccount/token", "r"))
          local token = assert(token_file:read("*a"))
          token_file:close()
          return token
        }
        proxy_pass https://kubernetes.default.svc.{{ .Values.proxy.clusterDomain }}/api/v1/namespaces/$arg_namespace/services;
        proxy_ssl_name kubernetes.default.svc;
        proxy_ssl_server_name on;
        proxy_ssl_trusted_certificate /var/run/secrets/kubernetes.io/serviceaccount/ca.crt;
        proxy_ssl_verify on;
        proxy_set_header Authorization "Bearer $kubernetes_token";
      }
    }

    server {
      listen 8080;
      server_name ~^flink--(?<namespace>{{ join "|" .Values.index.namespaces }})--(?<service>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)\.{{ .Values.proxy.baseDomain | replace "." "\\." }}$;

      resolver {{ .Values.proxy.resolver }} valid=10s;

      location / {
        proxy_pass http://$service.$namespace.svc.{{ .Values.proxy.clusterDomain }}:{{ .Values.proxy.flinkUpstream.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }

    server {
      listen 8080;
      server_name ~^(?<namespace>{{ join "|" .Values.index.namespaces }})--(?<service>[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)\.{{ .Values.proxy.baseDomain | replace "." "\\." }}$;

      resolver {{ .Values.proxy.resolver }} valid=10s;

      location / {
        proxy_pass http://$service.$namespace.svc.{{ .Values.proxy.clusterDomain }}:{{ .Values.proxy.upstream.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
  spark-services.lua: |
{{ tpl (.Files.Get "files/backend/spark-services.lua") . | indent 4 }}
  index.html: |
{{ .Files.Get "files/frontend/index.html" | indent 4 }}
  app.css: |
{{ .Files.Get "files/frontend/app.css" | indent 4 }}
  app.js: |
{{ .Files.Get "files/frontend/app.js" | indent 4 }}
  spark-logo.svg: |
{{ .Files.Get "files/frontend/spark-logo.svg" | indent 4 }}
  flink-logo.svg: |
{{ .Files.Get "files/frontend/flink-logo.svg" | indent 4 }}